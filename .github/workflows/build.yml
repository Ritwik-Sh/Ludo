name: Build APK
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # GitHub's ubuntu runners already ship the Android SDK (platform 34 + build-tools), so no setup-android step.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Ludo-${{ github.ref_name }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ludo-debug-apk
          path: Ludo-${{ github.ref_name }}.apk
      # Pushing a tag like v1.0 publishes a GitHub Release with the APK attached
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Ludo-${{ github.ref_name }}.apk
          generate_release_notes: true
